name: Deploy to GitHub Pages

# Manual only. If you set Settings -> Pages -> Source to "GitHub Actions",
# run this workflow to publish; with the simpler "Deploy from a branch"
# source, GitHub publishes on every push and this workflow isn't needed.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement:true turns Pages on for the repo if it isn't already
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # the app is static — no build step
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
